name: Build macOS

on: [push]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          clang++ -std=c++17 main.cpp -o KryptonDOS

      - name: Create .app bundle
        run: |
          mkdir -p KryptonDOS.app/Contents/MacOS
          mkdir -p KryptonDOS.app/Contents/Resources
          cp KryptonDOS KryptonDOS.app/Contents/MacOS/
          cp -r app dos KryptonDOS.app/Contents/Resources/
          cat > KryptonDOS.app/Contents/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>KryptonDOS</string>
              <key>CFBundleIdentifier</key>
              <string>com.thekroomvroom.kryptondos</string>
              <key>CFBundleName</key>
              <string>KryptonDOS</string>
              <key>CFBundleVersion</key>
              <string>0.1.0b</string>
          </dict>
          </plist>
          EOF

      - name: Create .dmg
        run: |
          hdiutil create -volname "KryptonDOS" -srcfolder KryptonDOS.app -ov -format UDZO KryptonDOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KryptonDOS-macOS
          path: KryptonDOS.dmg